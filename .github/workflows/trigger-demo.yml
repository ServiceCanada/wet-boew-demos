name: Trigger demo

on:
  push:
    branches:
      - "*"
      - "!gh-pages"

  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository'
        required: true
        type: choice
        options:
          - GCWeb
          - gcds-ext-mws
      pr_number:
        description: 'Pull Request number (e.g., 1234)'
        required: true
        type: string

jobs:
  build-demo:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-demo.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
      repository: ${{ github.event.inputs.repository }}

  update-submodules-on-trigger:
    if: github.event_name == 'workflow_dispatch'
    needs: build-demo
    uses: ./.github/workflows/update-submodule.yml
    with:
      pr_number: ${{ github.event.inputs.repository == 'GCWeb' && format('gcweb-pr{0}', github.event.inputs.pr_number) || format('gcds-ext-mws-pr{0}', github.event.inputs.pr_number) }}

  update-submodules-on-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/update-submodule.yml
    with:
      pr_number: ${{ github.ref_name }}
