name: Trigger demo

on:
  push:
    branches:
      - "*"
      - "!gh-pages"

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request branch name (e.g., 1234)'
        required: true
        type: string

jobs:
  build-demo:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-demo.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
    
  update-submodules-on-trigger:
    if: github.event_name == 'workflow_dispatch'
    needs: build-demo
    uses: ./.github/workflows/update-submodule.yml
    with:
      pr_number: gcweb-pr${{ github.event.inputs.pr_number }}

  update-submodules-on-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/update-submodule.yml
    with:
      pr_number: ${{ github.ref_name }}