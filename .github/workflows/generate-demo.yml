name: Generate demo

on:
  push:
    branches:
      - "*"
      - "!gh-pages"

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request branch name (e.g., 1234)'
        required: true
        type: string

jobs:
  generate-demo-on-trigger:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/demo-from-pr.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}

  generate-demo-on-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/demo-from-pr.yml
    with:
      pr_number: ${{ github.ref_name}}
    
  update-submodules-on-trigger:
    if: github.event_name == 'workflow_dispatch'
    needs: generate-demo-on-trigger
    uses: ./.github/workflows/add-submodule.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}

  update-submodules-on-push:
    if: github.event_name == 'push'
    needs: generate-demo-on-push
    uses: ./.github/workflows/add-submodule.yml
    with:
      pr_number: ${{ github.event.inputs.pr_number }}