name: Add/update Submodule in gh-pages

on:
  push:
    branches:
      - "*"
      - "!gh-pages"

  workflow_run:
    workflows: ["Build & Publish GCWeb PR"]
    types:
      - completed

jobs:
  add-submodule:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add or update submodule
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ -d "$BRANCH_NAME" ]; then
            echo "Submodule exists. Updating..."
            git submodule update --init --remote "$BRANCH_NAME"
          else
            echo "Adding submodule..."
            git submodule add -b "$BRANCH_NAME" https://github.com/ServiceCanada/wet-boew-demos.git "$BRANCH_NAME"
          fi

      - name: Commit changes
        run: |
          ls
          git add .
          git commit -m "Update or add submodule in gh-pages" --allow-empty
          git push origin gh-pages
