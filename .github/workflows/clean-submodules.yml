# Simple workflow for deploying static content to GitHub Pages
name: Remove stale demos

on:
  schedule:
    # Runs at 00:00 on the 1st day of January, April, July, and October
    - cron: '0 0 1 1,4,7,10 *'

  workflow_dispatch:

jobs:
  clean-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Find and delete stale submodules
        run: |
          #!/bin/bash
          set -euo pipefail

          current_date=$(date -u +%s)
          threshold=$((90*24*60*60))  # 2 days in seconds

          while read -r path; do
            if [ -d "$path/.git" ] || [ -f "$path/.git" ]; then
              pushd "$path" > /dev/null

              last_commit_date=$(git log -1 --format="%ct" 2>/dev/null || echo 0)
              popd > /dev/null

              if [[ "$last_commit_date" -eq 0 ]]; then
                echo "⚠️ No commits found in $path. Skipping."
                continue
              fi

              age=$((current_date - last_commit_date))
              echo "📆 Last commit: $last_commit_date (age: $age seconds)"

              if [ "$age" -gt "$threshold" ]; then
                echo "🗑️  Deleting stale submodule: $path"
                git rm -f "$path"
                sed -i '' "/$path/d" .gitmodules  # macOS-compatible sed
              else
                echo "✅ Submodule is fresh. Keeping: $path"
              fi
            else
              echo "⚠️ $path is not a valid submodule directory"
            fi
          done <<< "$submodule_paths"

      - name: Commit and push changes
        run: |
          git add .
          git commit -am "Remove stale submodules (inactive > 3 months)" || echo "No changes to commit"
          git push origin gh-pages