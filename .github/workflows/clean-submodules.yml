# Simple workflow for deploying static content to GitHub Pages
name: Remove stale demos

on:
  schedule:
    # Runs at 00:00 on the 1st day of January, April, July, and October
    - cron: '0 0 1 1,4,7,10 *'

  workflow_dispatch:

jobs:
  clean-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Find and delete stale submodules
        run: |
          set -euo pipefail

          echo "🧹 Starting stale submodule cleanup..."

          current_date=$(date -u +%s)
          threshold=$((2*24*60*60))  # 2 days in seconds

          if [ ! -f .gitmodules ]; then
            echo "❌ .gitmodules file not found. Exiting."
            exit 0
          fi

          echo "📄 .gitmodules content:"
          cat .gitmodules

          echo ""
          echo "🔍 Extracting submodule paths..."
          submodule_paths=$(awk '/path = / { print $3 }' .gitmodules)

          if [ -z "$submodule_paths" ]; then
            echo "⚠️ No submodule paths found in .gitmodules"
            exit 0
          fi

          echo "✅ Found submodule paths:"
          echo "$submodule_paths"

          while read -r path; do
            echo ""
            echo "🔎 Checking submodule: $path"

            if [ -d "$path/.git" ] || [ -f "$path/.git" ]; then
              pushd "$path" > /dev/null

              last_commit_date=$(git log -1 --format="%ct" 2>/dev/null || echo 0)
              popd > /dev/null

              if [[ "$last_commit_date" -eq 0 ]]; then
                echo "⚠️ No commits found in $path. Skipping."
                continue
              fi

              age=$((current_date - last_commit_date))
              echo "📆 Last commit: $last_commit_date (age: $age seconds)"

              if [ "$age" -gt "$threshold" ]; then
                echo "🗑️  Deleting stale submodule: $path"
                git rm -f "$path"
              else
                echo "✅ Submodule is fresh. Keeping: $path"
              fi
            else
              echo "⚠️ $path is not a valid submodule directory"
            fi
          done <<< "$submodule_paths"

      - name: Commit and push changes
        run: |
          git add .
          git commit -am "Remove stale submodules (inactive > 3 months)" || echo "No changes to commit"
          git push origin gh-pages